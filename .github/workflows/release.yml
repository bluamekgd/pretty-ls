name: Auto Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Check version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f2)
          OLD_VERSION=$(git show HEAD^:Cargo.toml | grep '^version = ' | head -1 | cut -d '"' -f2 || true)

          echo "Current version: $VERSION"
          echo "Previous version: $OLD_VERSION"

          if [ "$VERSION" = "$OLD_VERSION" ]; then
            echo "Version hasn't changed. Skipping release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version changed!"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build with Nix
        if: steps.version.outputs.changed == 'true'
        run: nix build

      - name: Copy binary
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp result/bin/pls "pls-v$VERSION-linux-x86_64"

      - name: Create release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          gh release create \
            "v$VERSION" \
            "pls-v$VERSION-linux-x86_64" \
            --title "Auto-Release v$VERSION" \
            --generate-notes
